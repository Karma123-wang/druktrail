<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Site Menu</title>
<style>
  /* ===== MAIN MENU STYLES ===== */
  :root {
    --menu-bg: #ffffff;
    --menu-text: #2b2b2b;
    --menu-accent: #c8102e;   /* change to your brand colour */
    --menu-accent-dark: #a00d25;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: "Segoe UI", Arial, sans-serif; }

  .site-header {
    position: sticky; top: 0; z-index: 1000;
    background: var(--menu-bg);
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
  }
  .nav-container {
    max-width: 1200px; margin: 0 auto;
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 20px;
  }
  .logo {
    font-size: 1.4rem; font-weight: 700;
    color: var(--menu-accent); text-decoration: none;
  }
  .main-menu { display: flex; align-items: center; gap: 4px; list-style: none; }
  .main-menu a {
    display: block; padding: 10px 12px;
    color: var(--menu-text); text-decoration: none;
    font-weight: 500; font-size: 0.95rem; border-radius: 6px;
    transition: color .2s, background .2s;
  }
  .main-menu a:hover,
  .main-menu a.active { color: var(--menu-accent); }
  .main-menu .btn-book {
    background: var(--menu-accent); color: #fff; margin-left: 8px; padding: 10px 18px;
  }
  .main-menu .btn-book:hover { background: var(--menu-accent-dark); color: #fff; }

  /* Hamburger button (mobile) */
  .menu-toggle {
    display: none; background: none; border: none; cursor: pointer; padding: 6px;
  }
  .menu-toggle span {
    display: block; width: 26px; height: 3px; margin: 5px 0;
    background: var(--menu-text); border-radius: 2px; transition: .3s;
  }
  .menu-toggle.open span:nth-child(1) { transform: translateY(8px) rotate(45deg); }
  .menu-toggle.open span:nth-child(2) { opacity: 0; }
  .menu-toggle.open span:nth-child(3) { transform: translateY(-8px) rotate(-45deg); }

  @media (max-width: 960px) {
    .menu-toggle { display: block; }
    .main-menu {
      position: absolute; top: 100%; left: 0; right: 0;
      flex-direction: column; align-items: stretch; gap: 0;
      background: var(--menu-bg);
      box-shadow: 0 6px 12px rgba(0,0,0,0.1);
      max-height: 0; overflow: hidden; transition: max-height .35s ease;
    }
    .main-menu.open { max-height: 600px; }
    .main-menu a { padding: 14px 20px; border-radius: 0; border-top: 1px solid #eee; }
    .main-menu .btn-book { margin: 12px 20px; text-align: center; border-radius: 6px; }
  }
</style>
</head>
<body>

<!-- ===== MAIN MENU ===== -->
<header class="site-header">
  <nav class="nav-container" aria-label="Main menu">
    <a href="index.html" class="logo">Your Logo</a>

    <button class="menu-toggle" aria-label="Open menu" aria-expanded="false">
      <span></span><span></span><span></span>
    </button>

    <ul class="main-menu">
      <li><a href="index.html">Home</a></li>
      <li><a href="tours-packages.html">Tours &amp; Packages</a></li>
      <li><a href="destinations.html">Destinations</a></li>
      <li><a href="trekking.html">Trekking</a></li>
      <li><a href="bhutan-experiences.html">Bhutan Experiences</a></li>
      <li><a href="about-us.html">About Us</a></li>
      <li><a href="gallery.html">Gallery</a></li>
      <li><a href="contact.html" class="btn-book">Contact / Book Now</a></li>
    </ul>
  </nav>
</header>

<script>
  // Mobile menu toggle
  const toggle = document.querySelector('.menu-toggle');
  const menu = document.querySelector('.main-menu');
  toggle.addEventListener('click', () => {
    const isOpen = menu.classList.toggle('open');
    toggle.classList.toggle('open', isOpen);
    toggle.setAttribute('aria-expanded', isOpen);
  });

  // Highlight the current page in the menu
  const current = location.pathname.split('/').pop() || 'index.html';
  document.querySelectorAll('.main-menu a').forEach(link => {
    if (link.getAttribute('href') === current) link.classList.add('active');
  });
</script>

</body>
</html>
